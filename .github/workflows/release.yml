name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GradeCaculatorWindowsInstaller.exe
          - os: macos-latest
            artifact: GradeCalculator-macOS.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build desktop app
        run: python -m PyInstaller packaging/grade_calculator.spec --noconfirm --clean

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'Inno Setup compiler was not found.'
          }
          $version = [regex]::Match((Get-Content 'backend\version.py' -Raw), '__version__\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) {
            throw 'The application version could not be read.'
          }
          & $iscc /Q "/DMyAppVersion=$version" 'packaging\GradeCalculator.iss'
          Copy-Item 'build\installer\GradeCaculatorWindowsInstaller.exe' 'GradeCaculatorWindowsInstaller.exe'

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' backend/version.py)"
          test -n "$app_version"
          mkdir -p "build/pkgroot/Applications/Grade Calculator"
          cp -R "dist/Grade Calculator.app" "build/pkgroot/Applications/Grade Calculator/"
          chmod +x packaging/macos-pkg-scripts/postinstall
          pkgbuild \
            --root build/pkgroot \
            --identifier com.winstonbaker.gradecalculator \
            --version "$app_version" \
            --install-location / \
            --scripts packaging/macos-pkg-scripts \
            "build/Grade Calculator.pkg"
          mkdir -p dmg
          cp "build/Grade Calculator.pkg" dmg/
          mkdir -p dmg/.payload
          cp -R "dist/Grade Calculator.app" dmg/.payload/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Grade Calculator" -srcfolder dmg -ov -format UDZO GradeCalculator-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GradeCaculatorWindowsInstaller.exe
            dist/GradeCalculator-macOS.dmg
          generate_release_notes: true
          make_latest: true
          body: |
            ## ${{ github.ref_name }}

            This release packages the current Grade Calculator experience with the latest gradebook, GPA dashboard, import/export, and update improvements.

            ## Download
            - **Windows:** [GradeCaculatorWindowsInstaller.exe](https://github.com/${{ github.repository }}/releases/latest/download/GradeCaculatorWindowsInstaller.exe) — download and run the installer; it installs `Grade Calculator.exe` inside a `Grade Calculator` folder and creates a desktop shortcut
            - **macOS:** [GradeCalculator-macOS.dmg](https://github.com/${{ github.repository }}/releases/latest/download/GradeCalculator-macOS.dmg) — open the disk image and run `Grade Calculator.pkg`; it installs `Grade Calculator.app` inside `Applications/Grade Calculator` and creates a desktop shortcut

            Grades stay on this computer in a local database. Use **Settings → Check for updates** to fetch later versions.
